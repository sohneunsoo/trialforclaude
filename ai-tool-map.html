<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef2fa;
    --surface: rgba(255,255,255,0.85);
    --surface-solid: #ffffff;
    --primary: #1a2a55;
    --accent: #4a7bcb;
    --accent-light: #dce8f8;
    --text: #0d0d0d;
    --text-2: #444;
    --text-3: #888;
    --border: rgba(0,0,0,0.08);
    --radius: 12px;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ---- nav ---- */
  .site-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(238,242,250,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(1rem, 4vw, 3rem);
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .site-nav a {
    color: var(--primary); text-decoration: none;
    font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .site-nav a:hover { opacity: 0.65; }
  .nav-title { font-size: 0.78rem; color: var(--text-3); letter-spacing: 0.04em; }

  /* ---- hero ---- */
  .hero {
    padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 4vw, 3rem) clamp(2rem, 5vw, 4rem);
    max-width: 860px;
    margin: 0 auto;
  }
  .hero-kicker {
    display: inline-block;
    background: var(--primary); color: #fff;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 4px 12px; border-radius: 4px;
    margin-bottom: 1.2rem;
  }
  .hero h1 {
    font-family: var(--serif); font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 600; line-height: 1.15; color: var(--primary);
    margin-bottom: 0.6rem;
  }
  .hero-sub {
    font-size: clamp(0.95rem, 2vw, 1.05rem); color: var(--text-2);
    margin-bottom: 1.4rem; max-width: 640px;
  }
  .hero-intro {
    font-size: 0.95rem; color: var(--text-2); line-height: 1.75;
    max-width: 640px; border-left: 3px solid var(--accent);
    padding-left: 1rem;
  }

  /* ---- how-to ---- */
  .how-to {
    background: var(--primary);
    color: #fff;
    padding: clamp(2rem, 5vw, 3.5rem) clamp(1rem, 4vw, 3rem);
  }
  .how-to-inner { max-width: 860px; margin: 0 auto; }
  .how-to h2 {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 600;
    margin-bottom: 1.2rem; opacity: 0.9;
  }
  .how-to ol {
    list-style: none; counter-reset: steps;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .how-to li {
    counter-increment: steps;
    background: rgba(255,255,255,0.08);
    border-radius: 8px; padding: 1rem 1.1rem;
    font-size: 0.88rem; line-height: 1.65;
    position: relative; padding-left: 2.6rem;
  }
  .how-to li::before {
    content: counter(steps);
    position: absolute; left: 0.9rem; top: 1rem;
    font-size: 0.72rem; font-weight: 700; opacity: 0.55;
  }

  /* ---- controls ---- */
  .controls {
    padding: 2rem clamp(1rem, 4vw, 3rem) 1.2rem;
    max-width: 1120px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center;
  }
  .search-wrap {
    flex: 1 1 260px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 0.55rem 1rem 0.55rem 2.4rem;
    border: 1.5px solid var(--border);
    border-radius: 8px; background: var(--surface-solid);
    font-size: 0.88rem; font-family: var(--sans); color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before {
    content: "🔍";
    position: absolute; left: 0.7rem; top: 50%;
    transform: translateY(-50%); font-size: 0.78rem; pointer-events: none;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .filter-btn {
    padding: 0.35rem 0.85rem; border-radius: 20px;
    border: 1.5px solid var(--border); background: var(--surface-solid);
    font-size: 0.78rem; font-family: var(--sans); color: var(--text-2);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }

  /* ---- tool grid ---- */
  .tool-grid {
    max-width: 1120px; margin: 0 auto;
    padding: 0.5rem clamp(1rem, 4vw, 3rem) 3rem;
  }

  .category-block { margin-bottom: 3rem; }
  .category-block.hidden { display: none; }

  .cat-header {
    margin-bottom: 1rem; padding-bottom: 0.6rem;
    border-bottom: 2px solid var(--primary);
    display: flex; align-items: baseline; gap: 0.8rem;
  }
  .cat-name {
    font-family: var(--serif); font-size: 1.35rem;
    font-weight: 600; color: var(--primary);
  }
  .cat-count { font-size: 0.75rem; color: var(--text-3); }
  .cat-desc { font-size: 0.82rem; color: var(--text-2); margin-bottom: 1rem; line-height: 1.6; }

  .tools-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.8rem;
  }

  .tool-card {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    transition: box-shadow 0.15s, transform 0.12s;
  }
  .tool-card:hover {
    box-shadow: 0 4px 18px rgba(74,123,203,0.12);
    transform: translateY(-2px);
  }
  .tool-card.hidden { display: none; }

  .tool-name {
    font-weight: 700; font-size: 0.92rem;
    color: var(--primary); margin-bottom: 0.25rem;
  }
  .tool-use {
    font-size: 0.82rem; color: var(--text-2); margin-bottom: 0.5rem;
    line-height: 1.5;
  }
  .tool-example {
    font-size: 0.78rem; color: var(--text-3);
    background: var(--accent-light); border-radius: 6px;
    padding: 0.35rem 0.55rem; margin-bottom: 0.45rem; line-height: 1.5;
  }
  .tool-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.35rem; }
  .chip {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 4px; line-height: 1.5;
  }
  .chip-for { background: #e8f0e8; color: #2a6a2a; }
  .chip-memo { background: #fff8e8; color: #7a5a10; }

  /* ---- pipelines ---- */
  .pipelines {
    background: var(--primary);
    padding: clamp(2.5rem, 6vw, 4rem) clamp(1rem, 4vw, 3rem);
  }
  .pipelines-inner { max-width: 1120px; margin: 0 auto; }
  .pipelines h2 {
    font-family: var(--serif); font-size: 1.8rem; font-weight: 600;
    color: #fff; margin-bottom: 0.4rem;
  }
  .pipelines-sub { font-size: 0.88rem; color: rgba(255,255,255,0.6); margin-bottom: 2rem; }

  .pipeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.2rem;
  }
  .pipeline-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius); padding: 1.2rem 1.3rem;
  }
  .pipeline-title {
    font-weight: 700; color: #fff; font-size: 0.9rem;
    margin-bottom: 0.8rem;
  }
  .pipeline-steps {
    list-style: none; counter-reset: steps;
  }
  .pipeline-steps li {
    counter-increment: steps;
    font-size: 0.8rem; color: rgba(255,255,255,0.75);
    padding: 0.3rem 0 0.3rem 1.8rem; position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.06); line-height: 1.5;
  }
  .pipeline-steps li:last-child { border-bottom: none; }
  .pipeline-steps li::before {
    content: counter(steps);
    position: absolute; left: 0;
    font-size: 0.65rem; font-weight: 700;
    color: rgba(255,255,255,0.35); top: 0.4rem;
  }

  /* ---- page footer ---- */
  .page-footer {
    text-align: center; padding: 2.5rem 1rem;
    font-size: 0.82rem; color: var(--text-3);
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .page-footer a { color: var(--accent); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }

  /* ---- no results ---- */
  .no-results {
    text-align: center; padding: 3rem 1rem;
    color: var(--text-3); font-size: 0.9rem; display: none;
  }

  @media (max-width: 600px) {
    .tools-list { grid-template-columns: 1fr; }
    .pipeline-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

document.getElementById('subtitle').textContent = DATA.subtitle;
document.getElementById('intro').textContent = DATA.intro;

// how-to
const howToList = document.getElementById('how-to-list');
DATA.howToUse.forEach(step => {
  const li = document.createElement('li');
  li.textContent = step;
  howToList.appendChild(li);
});

// category filters
const filtersEl = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '전체';
allBtn.dataset.cat = 'all';
filtersEl.appendChild(allBtn);
DATA.categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = cat.name;
  btn.dataset.cat = cat.id;
  filtersEl.appendChild(btn);
});

// render categories
const catContainer = document.getElementById('categories');
DATA.categories.forEach(cat => {
  const block = document.createElement('div');
  block.className = 'category-block';
  block.dataset.catId = cat.id;

  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `<span class="cat-name">${cat.name}</span><span class="cat-count">${cat.tools.length}개</span>`;
  block.appendChild(header);

  const desc = document.createElement('p');
  desc.className = 'cat-desc';
  desc.textContent = cat.description;
  block.appendChild(desc);

  const list = document.createElement('div');
  list.className = 'tools-list';
  cat.tools.forEach(tool => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.dataset.search = [tool.name, tool.use, tool.example, tool.recommendedFor, tool.memo].join(' ').toLowerCase();
    card.innerHTML = `
      <div class="tool-name">${tool.name}</div>
      <div class="tool-use">${tool.use}</div>
      <div class="tool-example">예: ${tool.example}</div>
      <div class="tool-meta">
        <span class="chip chip-for">→ ${tool.recommendedFor}</span>
        <span class="chip chip-memo">${tool.memo}</span>
      </div>`;
    list.appendChild(card);
  });
  block.appendChild(list);
  catContainer.appendChild(block);
});

// pipelines
const pipelineGrid = document.getElementById('pipeline-grid');
DATA.pipelines.forEach(p => {
  const card = document.createElement('div');
  card.className = 'pipeline-card';
  const stepsHtml = p.steps.map(s => `<li>${s}</li>`).join('');
  card.innerHTML = `<div class="pipeline-title">${p.title}</div><ol class="pipeline-steps">${stepsHtml}</ol>`;
  pipelineGrid.appendChild(card);
});

  const q = document.getElementById('search').value.toLowerCase().trim();
  let anyVisible = false;
  document.querySelectorAll('.category-block').forEach(block => {
    const catId = block.dataset.catId;
    const catMatch = activeCat === 'all' || activeCat === catId;
    if (!catMatch) { block.classList.add('hidden'); return; }
    block.classList.remove('hidden');
    let blockHasVisible = false;
    block.querySelectorAll('.tool-card').forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle('hidden', !match);
      if (match) { blockHasVisible = true; anyVisible = true; }
    });
    block.classList.toggle('hidden', !blockHasVisible);
  });
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

document.getElementById('search').addEventListener('input', applyFilter);
filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  applyFilter();
});
</script>
<script src="./return-timer.js"></script>
</body>
</html>
